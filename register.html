<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account | Nexora Capital</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <main class="auth-page">

        <div class="auth-container">

            <a href="index.html" class="brand auth-logo">
                <span class="brand-icon">
                    <i class="fa-solid fa-chart-line"></i>
                </span>

                <span>NEXORA<span class="brand-light"> CAPITAL</span></span>
            </a>

            <div class="auth-card">

                <span class="section-label">NEW ACCOUNT</span>

                <h1>Create your account</h1>

                <p>
                    Create a fresh profile. Your account starts with a zero balance and no investments.
                </p>

                <div id="authMessage" class="auth-message" role="status" aria-live="polite"></div>

                <form id="registerForm">

                    <div class="form-row">

                        <div class="form-group">
                            <label for="firstName">First name</label>

                            <input type="text" id="firstName" name="firstName" placeholder="First name"
                                autocomplete="given-name" required>
                        </div>

                        <div class="form-group">
                            <label for="lastName">Last name</label>

                            <input type="text" id="lastName" name="lastName" placeholder="Last name"
                                autocomplete="family-name" required>
                        </div>

                    </div>


                    <div class="form-group">
                        <label for="registerEmail">Email address</label>

                        <input type="email" id="registerEmail" name="email" placeholder="you@example.com"
                            autocomplete="email" required>
                    </div>


                    <div class="form-group">
                        <label for="registerPassword">Password</label>

                        <input type="password" id="registerPassword" name="password"
                            placeholder="At least 12 characters" autocomplete="new-password" minlength="12" required>
                    </div>


                    <div class="form-group">
                        <label for="confirmPassword">Confirm password</label>

                        <input type="password" id="confirmPassword" name="confirmPassword"
                            placeholder="Enter your password again" autocomplete="new-password" minlength="12" required>
                    </div>


                    <div class="auth-notice">

                       <strong> SECURITY REMINDER:</strong> Never share passwords, private keys, recovery phrases or authentication codes
                        with anyone.
                    </div>

                    <button type="submit" class="btn btn-primary btn-block" style="margin-top: 22px">

                        Create Account
                        <i class="fa-solid fa-arrow-right"></i>

                    </button>

                </form>


                <div class="auth-switch">
                    Already have an account?
                    <a href="login.html">Log in</a>
                </div>

                <div class="auth-switch">
                    <a href="index.html">
                        <i class="fa-solid fa-arrow-left"></i>
                        Back to homepage
                    </a>
                </div>

            </div>

        </div>

    </main>

    <script src="js/auth.js"></script>

</body>

</html>
